<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <title>Port Control</title>
    <!-- loading screen: inline so it shows before any script or stylesheet has loaded -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 90% at 50% 40%, #f4f8fd 0%, #e3edf7 60%, #d6e3f2 100%);
        font-family: Inter, system-ui, -apple-system, sans-serif;
        color: #1b2440;
        transition: opacity 0.45s ease;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      #boot.gone {
        display: none;
      }
      .boot-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }
      .boot-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        font-size: 20px;
        letter-spacing: -0.01em;
      }
      .boot-logo em {
        font-style: normal;
        color: #2f6bed;
      }
      .boot-mark {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: linear-gradient(135deg, #2f6bed, #1e3a8a);
        box-shadow: 0 6px 16px rgba(47, 107, 237, 0.35);
      }
      .boot-port {
        margin-top: 6px;
        font-size: 15px;
        font-weight: 700;
      }
      .boot-step {
        font-size: 12.5px;
        color: #6b7591;
        min-height: 16px;
      }
      .boot-bar {
        width: 220px;
        height: 4px;
        border-radius: 4px;
        background: rgba(47, 107, 237, 0.14);
        overflow: hidden;
      }
      .boot-bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: #2f6bed;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-logo"><span class="boot-mark"></span><span>Port <em>Control</em></span></div>
        <div class="boot-port" id="boot-port">Loading port</div>
        <div class="boot-bar"><i></i></div>
        <div class="boot-step" id="boot-step">Loading map data…</div>
      </div>
    </div>
    <script>
      // name the port being opened (same rules as src/ports/registry.ts)
      ;(function () {
        var names = { 'san-diego': 'Port of San Diego', 'long-beach': 'Port of Long Beach' }
        var id = new URLSearchParams(location.search).get('port')
        try {
          if (!names[id]) id = localStorage.getItem('anymile-port')
        } catch (e) {}
        document.getElementById('boot-port').textContent = names[id] || names['san-diego']
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
